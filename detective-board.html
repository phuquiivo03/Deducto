<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Ashcombe Case — Detective Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F0E4;
    --bg-dot: rgba(46,43,36,0.10);
    --card: #FFFFFF;
    --card-border: #E7DFCC;
    --text: #2C2A24;
    --text-soft: #6F6858;
    --text-faint: #9C9482;
    --gold: #B08328;
    --gold-bg: #F4E7C6;
    --gold-line: #C89A3C;
    --green: #5E8A62;
    --green-bg: #E4EFE1;
    --red: #BD5F51;
    --red-bg: #F5E2DD;
    --gray-line: #CBC2AC;
    --shadow-sm: 0 1px 2px rgba(40,36,24,0.07), 0 1px 1px rgba(40,36,24,0.05);
    --shadow-md: 0 6px 20px rgba(40,36,24,0.10), 0 2px 6px rgba(40,36,24,0.06);
    --shadow-lg: 0 16px 40px rgba(40,36,24,0.18), 0 4px 12px rgba(40,36,24,0.08);
    --radius-card: 14px;
    --radius-sm: 9px;
    --nav-h: 62px;
    color-scheme: light;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  h1,h2,h3, .display{ font-family:'Outfit', 'Inter', sans-serif; }
  button{ font-family: inherit; }
  ::selection{ background: var(--gold-bg); }

  /* ---------- App shell ---------- */
  .app{ height:100vh; height:100dvh; display:flex; flex-direction:column; }

  .topbar{
    display:flex; align-items:center; gap:14px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--card-border);
    background: var(--card);
    flex: 0 0 auto;
    z-index: 20;
  }
  .topbar .mark{
    width:34px; height:34px; border-radius:10px;
    background: linear-gradient(160deg, #3B3730, #23211C);
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow-sm);
  }
  .topbar .mark svg{ width:18px; height:18px; }
  .topbar .titles{ line-height:1.15; }
  .topbar .titles .case-title{ font-weight:600; font-size:16px; letter-spacing:-0.01em; }
  .topbar .titles .case-sub{ font-size:12.5px; color: var(--text-soft); }
  .topbar .spacer{ flex:1; }
  .topbar .progress{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; color: var(--text-soft);
    background: #F7F2E6; border:1px solid var(--card-border);
    padding:6px 12px; border-radius:999px;
  }
  .topbar .progress b{ color: var(--text); font-weight:600; }
  .topbar .progress .dot{ width:6px; height:6px; border-radius:50%; background: var(--gold); }

  .layout{ flex:1; display:flex; min-height:0; }

  /* ---------- Shared panel chrome ---------- */
  .panel-head{ padding: 18px 18px 12px; }
  .panel-head h2{ margin:0; font-size:15px; font-weight:600; letter-spacing:-0.01em; }
  .panel-head p{ margin:4px 0 0; font-size:12.5px; color: var(--text-soft); line-height:1.4; }

  /* ---------- Clues column ---------- */
  .clues-panel{
    width: 268px; flex: 0 0 auto;
    background: var(--card);
    border-right: 1px solid var(--card-border);
    display:flex; flex-direction:column; min-height:0;
  }
  .clue-list{ flex:1; overflow-y:auto; padding: 4px 14px 18px; display:flex; flex-direction:column; gap:9px; }
  .clue-card{
    text-align:left; width:100%; cursor:pointer;
    background:#FDFCF9; border:1px solid var(--card-border);
    border-radius: var(--radius-sm);
    padding: 11px 12px;
    display:flex; flex-direction:column; gap:6px;
    transition: border-color .15s ease, box-shadow .15s ease, transform .12s ease;
  }
  .clue-card:hover{ box-shadow: var(--shadow-sm); transform: translateY(-1px); }
  .clue-card.active{ border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-bg); }
  .clue-top{ display:flex; align-items:center; justify-content:space-between; }
  .clue-num{ font-size:11px; font-weight:600; color: var(--gold); letter-spacing:.02em; }
  .clue-status{
    font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:999px;
    letter-spacing:.02em;
  }
  .clue-status.new{ background: var(--gold-bg); color:#8C6A1E; }
  .clue-status.analyzed{ background: var(--green-bg); color:#42663F; }
  .clue-status.used{ background:#EDEAE1; color: var(--text-faint); }
  .clue-text{ font-size:13px; line-height:1.48; color: var(--text); }

  /* ---------- Board column ---------- */
  .board-panel{ flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; position:relative; }

  .board-toolbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 18px; border-bottom:1px solid var(--card-border);
    background: rgba(245,240,228,0.9); backdrop-filter: blur(6px);
    flex: 0 0 auto; gap:12px;
  }
  .seg{ display:flex; background:#EDE7D6; border-radius:10px; padding:3px; gap:2px; }
  .seg button{
    border:none; background:transparent; padding:6px 14px; font-size:12.5px; font-weight:600;
    color: var(--text-soft); border-radius:8px; cursor:pointer; transition: background .15s, color .15s;
  }
  .seg button.active{ background: var(--card); color: var(--text); box-shadow: var(--shadow-sm); }
  .tool-actions{ display:flex; gap:8px; }
  .btn{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--card-border); background: var(--card);
    padding: 7px 13px; border-radius:9px; font-size:12.5px; font-weight:600;
    color: var(--text); cursor:pointer; transition: box-shadow .15s, transform .12s, border-color .15s;
  }
  .btn:hover{ box-shadow: var(--shadow-sm); transform: translateY(-1px); }
  .btn.ghost{ background:transparent; }
  .btn svg{ width:14px; height:14px; }

  .board-scroll{ flex:1; overflow:auto; position:relative; }
  .board-surface{
    position:relative;
    width:1560px; height:980px;
    background-image: radial-gradient(var(--bg-dot) 1.2px, transparent 1.2px);
    background-size: 22px 22px;
    background-color: var(--bg);
  }
  .connections{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  .conn-line{ fill:none; transition: stroke .2s ease, opacity .2s ease, stroke-width .2s ease; }
  .conn-line.confirmed{ stroke: var(--green); stroke-width: 2.2; }
  .conn-line.impossible{ stroke: var(--red); stroke-width: 1.8; stroke-dasharray: 5 5; }
  .conn-line.unknown{ stroke: var(--gray-line); stroke-width: 1.6; stroke-dasharray: 3 5; }
  .conn-line.dim{ opacity: .18; }
  .conn-line.active{ stroke-width: 2.8; }

  .conn-label{
    position:absolute; transform: translate(-50%,-50%);
    font-size: 10px; font-weight:700; letter-spacing:.03em;
    padding: 3px 8px; border-radius:999px; white-space:nowrap;
    border:1px solid transparent; pointer-events:none;
    transition: opacity .2s ease;
  }
  .conn-label.confirmed{ background: var(--gold-bg); color:#8C6A1E; border-color:#E7CE93; }
  .conn-label.impossible{ background: var(--red-bg); color:#9A4136; border-color:#E3B8AE; }
  .conn-label.unknown{ background:#F1ECDD; color: var(--text-faint); border-color: var(--card-border); }
  .conn-label.dim{ opacity:.25; }

  /* ---------- Entity cards ---------- */
  .card{
    position:absolute; width:196px;
    background: var(--card); border:1px solid var(--card-border);
    border-radius: var(--radius-card); box-shadow: var(--shadow-sm);
    padding: 12px 13px 13px; cursor: grab;
    transition: box-shadow .18s ease, opacity .18s ease, border-color .18s ease, transform .12s ease;
    user-select:none; touch-action:none;
  }
  .card:active{ cursor:grabbing; }
  .card:hover{ box-shadow: var(--shadow-md); }
  .card.dimmed{ opacity:.35; }
  .card.highlighted{ border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-bg), var(--shadow-md); }
  .card.selected{ border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-bg), var(--shadow-lg); transform: translateY(-1px); }
  .card.pulse{ animation: pulseGlow 1.1s ease; }
  @keyframes pulseGlow{
    0%{ box-shadow: 0 0 0 0 var(--gold-bg), var(--shadow-md); }
    40%{ box-shadow: 0 0 0 8px var(--gold-bg), var(--shadow-md); }
    100%{ box-shadow: 0 0 0 3px var(--gold-bg), var(--shadow-md); }
  }
  .card-top{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .card-icon{
    width:30px; height:30px; border-radius:9px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    background:#F3EEE0; color: var(--text-soft);
  }
  .card-icon svg{ width:16px; height:16px; }
  .card-label{ font-size:10px; font-weight:700; letter-spacing:.06em; color: var(--text-faint); }
  .card-name{ font-size:14.5px; font-weight:600; margin:1px 0 3px; letter-spacing:-0.01em; }
  .card-meta{ font-size:11.5px; color: var(--text-soft); line-height:1.35; }

  /* ---------- Sticky notes ---------- */
  .note{
    position:absolute; width:150px; min-height:96px;
    background:#FBF7EC; border:1px solid #E9DFC2; border-radius:10px;
    box-shadow: var(--shadow-sm); padding:10px 11px;
    font-size:12.5px; line-height:1.45; color:#4A452F;
    cursor:grab; transform: rotate(var(--rot,-1.2deg));
    transition: box-shadow .15s ease;
    touch-action:none;
  }
  .note:hover{ box-shadow: var(--shadow-md); }
  .note:active{ cursor:grabbing; }
  .note .note-pin{ position:absolute; top:-6px; left:50%; transform:translateX(-50%); width:10px; height:10px; border-radius:50%; background: var(--gold); box-shadow: var(--shadow-sm); }
  .note [contenteditable]{ outline:none; }
  .note .note-del{
    position:absolute; top:4px; right:5px; width:16px; height:16px; border-radius:50%;
    border:none; background:transparent; color:#B8AF95; font-size:13px; line-height:1; cursor:pointer;
    display:none; align-items:center; justify-content:center;
  }
  .note:hover .note-del{ display:flex; }

  /* ---------- Toasts ---------- */
  .toast-stack{
    position:absolute; right:18px; top:16px; z-index:40;
    display:flex; flex-direction:column; gap:10px; align-items:flex-end;
    pointer-events:none;
  }
  .toast{
    pointer-events:auto;
    width: 296px; background: var(--card); border:1px solid var(--card-border);
    border-left: 3px solid var(--gold);
    border-radius: 12px; box-shadow: var(--shadow-lg); padding: 12px 14px;
    animation: toastIn .28s cubic-bezier(.2,.8,.3,1.1);
  }
  @keyframes toastIn{ from{ opacity:0; transform: translateY(-8px) scale(.98);} to{ opacity:1; transform:none; } }
  .toast .t-head{ display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color: var(--gold); letter-spacing:.02em; margin-bottom:4px; }
  .toast .t-rel{ font-size:14px; font-weight:600; margin-bottom:4px; }
  .toast .t-exp{ font-size:12px; color: var(--text-soft); line-height:1.4; }

  /* ---------- Inspector column ---------- */
  .inspector-panel{
    width: 292px; flex:0 0 auto;
    background: var(--card); border-left:1px solid var(--card-border);
    display:flex; flex-direction:column; min-height:0;
  }
  .inspector-body{ flex:1; overflow-y:auto; padding: 6px 18px 22px; }

  .empty-state{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    gap:12px; padding: 40px 12px; color: var(--text-soft);
  }
  .empty-state .ic{
    width:52px; height:52px; border-radius:14px; background:#F3EEE0;
    display:flex; align-items:center; justify-content:center; color: var(--text-faint);
  }
  .empty-state p{ font-size:13px; line-height:1.5; margin:0; max-width:190px; }

  .insp-head{ display:flex; gap:10px; align-items:center; padding: 8px 0 16px; border-bottom:1px solid var(--card-border); margin-bottom:16px; }
  .insp-icon{ width:42px; height:42px; border-radius:12px; background:#F3EEE0; display:flex; align-items:center; justify-content:center; color:var(--text-soft); flex:0 0 auto; }
  .insp-icon svg{ width:20px; height:20px; }
  .insp-name{ font-size:16px; font-weight:600; letter-spacing:-0.01em; }
  .insp-type{ font-size:10.5px; font-weight:700; letter-spacing:.06em; color: var(--text-faint); margin-top:1px; }

  .insp-section{ margin-bottom:20px; }
  .insp-section h3{ margin:0 0 9px; font-size:11px; font-weight:700; letter-spacing:.04em; color: var(--text-faint); }
  .fact-row{ display:flex; gap:8px; align-items:flex-start; font-size:13px; line-height:1.45; margin-bottom:7px; }
  .fact-row .ic{ flex:0 0 auto; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-top:1px; }
  .fact-row.ok .ic{ background: var(--green-bg); color: var(--green); }
  .fact-row.no .ic{ background: var(--red-bg); color: var(--red); }
  .fact-row .ic svg{ width:10px; height:10px; }

  .clue-chip{
    display:flex; gap:8px; align-items:flex-start; font-size:12.5px; line-height:1.4;
    background:#FBF8F0; border:1px solid var(--card-border); border-radius:9px;
    padding:8px 10px; margin-bottom:7px; color: var(--text-soft);
  }
  .clue-chip b{ color: var(--gold); font-weight:700; }

  .rel-row{
    border:1px solid var(--card-border); border-radius:10px; padding:10px 11px; margin-bottom:8px; background:#FDFCF9;
  }
  .rel-row .rel-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .rel-name{ font-size:13px; font-weight:600; display:flex; align-items:center; gap:7px; }
  .rel-mark{ width:17px; height:17px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:0 0 auto; font-size:10px; }
  .rel-mark.confirmed{ background: var(--green-bg); color: var(--green); }
  .rel-mark.impossible{ background: var(--red-bg); color: var(--red); }
  .rel-mark.unknown{ background:#EDEAE1; color: var(--text-faint); }
  .why-btn{
    border:none; background:transparent; color: var(--text-faint); font-size:11px; font-weight:600;
    cursor:pointer; padding:2px 6px; border-radius:6px; text-decoration: underline; text-underline-offset:2px;
  }
  .why-btn:hover{ color: var(--gold); }
  .why-text{
    margin-top:8px; padding-top:8px; border-top:1px dashed var(--card-border);
    font-size:12px; color: var(--text-soft); line-height:1.5; display:none;
  }
  .why-text.open{ display:block; }
  .why-text .q{ font-weight:700; color: var(--text); display:block; margin-bottom:3px; font-size:11px; letter-spacing:.02em; }

  .rel-actions{ display:flex; gap:7px; margin-top:9px; }
  .rel-actions button{
    flex:1; border:1px solid var(--card-border); background: var(--card); border-radius:8px;
    padding:6px 8px; font-size:11.5px; font-weight:600; cursor:pointer; transition: all .15s;
  }
  .rel-actions .confirm:hover{ border-color: var(--green); color: var(--green); background: var(--green-bg); }
  .rel-actions .impossible:hover{ border-color: var(--red); color: var(--red); background: var(--red-bg); }

  /* ---------- Grid view ---------- */
  .grid-view{ display:none; flex:1; overflow:auto; padding: 22px 26px; }
  .grid-view.active{ display:block; }
  .board-scroll.hidden{ display:none; }
  .grid-table-wrap{ background: var(--card); border:1px solid var(--card-border); border-radius:14px; box-shadow: var(--shadow-sm); overflow:hidden; margin-bottom:22px; }
  .grid-title{ padding:14px 16px 0; font-size:13px; font-weight:600; color: var(--text-soft); }
  table.gt{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.gt th, table.gt td{ padding:10px 12px; text-align:center; border-bottom:1px solid var(--card-border); }
  table.gt th{ font-weight:600; color: var(--text-soft); font-size:11.5px; text-align:left; }
  table.gt th.rowlabel, table.gt td.rowlabel{ text-align:left; font-weight:600; color: var(--text); }
  table.gt td.cell{ cursor:pointer; }
  table.gt tr:last-child td{ border-bottom:none; }
  .gcell{ width:26px; height:26px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; transition: transform .1s; }
  .gcell:hover{ transform: scale(1.12); }
  .gcell.confirmed{ background: var(--green-bg); color: var(--green); }
  .gcell.impossible{ background: var(--red-bg); color: var(--red); }
  .gcell.unknown{ background:#EFEAD9; color: var(--text-faint); }

  /* ---------- Mobile bottom nav ---------- */
  .bottom-nav{ display:none; }

  /* ---------- Drawers / sheets (mobile) ---------- */
  .backdrop{ position:fixed; inset:0; background: rgba(30,27,20,0.35); z-index:35; opacity:0; pointer-events:none; transition: opacity .2s ease; }
  .backdrop.show{ opacity:1; pointer-events:auto; }

  /* Scrollbars */
  .clue-list::-webkit-scrollbar, .inspector-body::-webkit-scrollbar, .board-scroll::-webkit-scrollbar, .grid-view::-webkit-scrollbar{ width:9px; height:9px; }
  .clue-list::-webkit-scrollbar-thumb, .inspector-body::-webkit-scrollbar-thumb, .board-scroll::-webkit-scrollbar-thumb, .grid-view::-webkit-scrollbar-thumb{ background: #DCD3BA; border-radius:99px; border:2px solid transparent; background-clip: content-box; }

  /* ========================================================= */
  /* Mobile layout                                              */
  /* ========================================================= */
  @media (max-width: 860px){
    .topbar{ padding: 10px 14px calc(10px + env(safe-area-inset-top,0px)); }
    .topbar .case-sub{ display:none; }
    .layout{ position:relative; }

    .clues-panel{
      position:fixed; z-index:36; top:0; bottom:0; left:0;
      width:86%; max-width:330px;
      transform: translateX(-100%); transition: transform .25s ease;
      padding-top: env(safe-area-inset-top,0px);
      box-shadow: var(--shadow-lg);
    }
    .clues-panel.open{ transform: translateX(0); }

    .board-panel{ width:100%; }
    .board-toolbar{ padding:8px 12px; }
    .board-toolbar .tool-actions .btn span{ display:none; }
    .board-toolbar .tool-actions .btn{ padding:8px; }

    .inspector-panel{
      position:fixed; z-index:37; left:0; right:0; bottom: var(--nav-h);
      width:auto; max-height:72vh; border-left:none;
      border-top:1px solid var(--card-border);
      border-radius:18px 18px 0 0; box-shadow: var(--shadow-lg);
      transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.3,1);
    }
    .inspector-panel.open{ transform: translateY(0); }
    .sheet-handle{ display:flex; justify-content:center; padding:8px 0 2px; }
    .sheet-handle span{ width:36px; height:4px; border-radius:99px; background: var(--card-border); }
    .inspector-panel .panel-head{ display:flex; align-items:center; justify-content:space-between; }
    .sheet-close{ border:none; background:#F3EEE0; width:26px; height:26px; border-radius:50%; color: var(--text-soft); font-size:14px; cursor:pointer; }

    .bottom-nav{
      display:flex; position:fixed; left:0; right:0; bottom:0; height: var(--nav-h);
      background: var(--card); border-top:1px solid var(--card-border);
      z-index:38; padding-bottom: env(safe-area-inset-bottom,0px);
    }
    .bottom-nav button{
      flex:1; border:none; background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:3px; color: var(--text-faint); font-size:10.5px; font-weight:600; cursor:pointer; padding:6px 2px;
    }
    .bottom-nav button svg{ width:19px; height:19px; }
    .bottom-nav button.active{ color: var(--gold); }

    .toast-stack{ right:10px; left:10px; top:10px; align-items:stretch; }
    .toast{ width:100%; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#F1E6C8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.2"/><line x1="15.1" y1="15.1" x2="20" y2="20"/></svg>
    </div>
    <div class="titles">
      <div class="case-title">The Ashcombe Case</div>
      <div class="case-sub">Detective Board</div>
    </div>
    <div class="spacer"></div>
    <div class="progress"><span class="dot"></span> <b id="confirmedCount">4</b>&nbsp;of&nbsp;9 relationships confirmed</div>
  </header>

  <div class="layout">

    <!-- CLUES -->
    <aside class="clues-panel" id="cluesPanel">
      <div class="panel-head">
        <h2>Clues</h2>
        <p>Information you've discovered</p>
      </div>
      <div class="clue-list" id="clueList"></div>
    </aside>

    <!-- BOARD -->
    <section class="board-panel">
      <div class="board-toolbar">
        <div class="seg" id="viewSeg">
          <button class="active" data-view="board">Board</button>
          <button data-view="grid">Grid</button>
        </div>
        <div class="tool-actions">
          <button class="btn ghost" id="addNoteBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Add Note</span>
          </button>
          <button class="btn ghost" id="resetBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
            <span>Reset</span>
          </button>

      <div class="board-scroll" id="boardScroll">
        <div class="board-surface" id="boardSurface">
          <svg class="connections" id="connSvg"></svg>
          <div id="connLabels"></div>
          <div id="cardLayer"></div>
          <div id="noteLayer"></div>
        </div>
      </div>

      <div class="grid-view" id="gridView"></div>

      <div class="toast-stack" id="toastStack"></div>
    </section>

    <!-- INSPECTOR -->
    <aside class="inspector-panel" id="inspectorPanel">
      <div class="sheet-handle"><span></span></div>
      <div class="panel-head">
        <div>
          <h2>Inspector</h2>
        </div>
        <button class="sheet-close" id="sheetClose">✕</button>
      </div>
      <div class="inspector-body" id="inspectorBody"></div>
    </aside>

  </div>

  <nav class="bottom-nav" id="bottomNav">
    <button data-tab="suspects">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.3"/><path d="M5 20c1-3.8 4-5.6 7-5.6s6 1.8 7 5.6"/></svg>
      Suspects
    </button>
    <button data-tab="board" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="16" rx="2.4"/><circle cx="8" cy="9" r="1.4"/><circle cx="16" cy="12" r="1.4"/><circle cx="9" cy="16" r="1.4"/><line x1="8" y1="9" x2="16" y2="12"/><line x1="16" y1="12" x2="9" y2="16"/></svg>
      Board
    </button>
    <button data-tab="evidence">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6.5V12c0 5 3.4 7.8 8 9 4.6-1.2 8-4 8-9V6.5Z"/></svg>
      Evidence
    </button>
    <button data-tab="clues">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h9l5 5V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5.5a1 1 0 0 1 1-1Z"/><path d="M14 4.5V9h5"/><line x1="8" y1="13" x2="15" y2="13"/><line x1="8" y1="16.5" x2="12.5" y2="16.5"/></svg>
      Clues
    </button>
    <button data-tab="accuse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 5 3.8 8.4 9 10 5.2-1.6 9-5 9-10V6Z"/><path d="m9 12 2 2 4-4"/></svg>
      Accuse
    </button>
  </nav>

  <div class="backdrop" id="backdrop"></div>
</div>

<script>
(function(){

  /* ---------------------------------------------------------------
     Data
  ----------------------------------------------------------------*/
  const ICONS = {
    suspect: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M4.8 20c1.1-4 4.3-6 7.2-6s6.1 2 7.2 6"/></svg>',
    weapon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 3 20 8.5 8.5 20 3 21l1-5.5Z"/><line x1="13" y1="4.5" x2="18.5" y2="10"/></svg>',
    location: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.4 7-11.6A7 7 0 0 0 5 9.4C5 14.6 12 21 12 21Z"/><circle cx="12" cy="9.4" r="2.3"/></svg>'
  };

  const entities = {
    violet:      { id:'violet', type:'suspect', name:'Lady Violet', meta:'Art dealer · Right-handed', x:70,  y:70,
                   facts:[ {ok:true, text:'Right-handed'}, {ok:true, text:'Arrived at 9:15 PM, wearing gloves'}, {ok:false, text:'Not at the Mansion after 10 PM'} ] },
    grant:       { id:'grant', type:'suspect', name:'Professor Grant', meta:'Historian · Left-handed', x:1000, y:50,
                   facts:[ {ok:true, text:'Left-handed'}, {ok:false, text:'Avoids enclosed rooms — documented fear'}, {ok:true, text:'Seen reading in the study at 10 PM'} ] },
    chen:        { id:'chen', type:'suspect', name:'Mr. Chen', meta:'Chef · Ambidextrous', x:70,  y:560,
                   facts:[ {ok:true, text:'Placed in the library until midnight'}, {ok:true, text:'Had kitchen access all evening'} ] },

    dagger:      { id:'dagger', type:'weapon', name:'Crystal Dagger', meta:'Found near the garden', x:560,  y:270,
                   facts:[ {ok:true, text:'Found damp, near the fountain'}, {ok:true, text:'Matches the wound pattern'} ] },
    candlestick: { id:'candlestick', type:'weapon', name:'Candlestick', meta:'Missing from the study', x:1080, y:300,
                   facts:[ {ok:true, text:'Reported missing at 9 PM'} ] },
    poison:      { id:'poison', type:'weapon', name:'Poison Vial', meta:'Locked in the cabinet', x:640,  y:700,
                   facts:[ {ok:true, text:'Cabinet was locked all evening'} ] },

    garden:      { id:'garden', type:'location', name:'Garden', meta:'Empty at 11:15 PM', x:540,  y:560,
                   facts:[ {ok:true, text:'Confirmed empty at 11:15 PM'}, {ok:true, text:'Fountain area accessible from the terrace'} ] },
    library:     { id:'library', type:'location', name:'Library', meta:'Occupied until midnight', x:70,   y:800,
                   facts:[ {ok:true, text:'Fire was lit from 9 PM to midnight'} ] },
    conservatory:{ id:'conservatory', type:'location', name:'Conservatory', meta:'Locked after 10 PM', x:1080, y:600,
                   facts:[ {ok:true, text:'Locked from the inside after 10 PM'} ] },
  };

  // status: 'confirmed' | 'impossible' | 'unknown'
  const relationships = [
    { id:'r1', a:'violet', b:'dagger',      label:'HAS WEAPON', status:'confirmed', reason:"Clue #2 places Violet at the scene, and Clue #1 found the dagger nearby — no other suspect had access." },
    { id:'r2', a:'dagger', b:'garden',      label:'FOUND AT',   status:'confirmed', reason:"Clue #1: the Crystal Dagger was found near the garden fountain, still damp." },
    { id:'r3', a:'violet', b:'garden',      label:'WAS AT',     status:'confirmed', reason:"Violet cannot be at the Mansion, and the other locations have already been eliminated." },
    { id:'r4', a:'grant',  b:'conservatory',label:'AVOIDS',     status:'impossible', reason:"Clue #4: Professor Grant has a documented fear of enclosed spaces and avoids the conservatory entirely." },
    { id:'r5', a:'grant',  b:'candlestick', label:'?',          status:'unknown', reason:"No clue yet connects Grant to the candlestick." },
    { id:'r6', a:'chen',   b:'library',     label:'WAS AT',     status:'confirmed', reason:"Clue #5: a witness places Mr. Chen in the library until midnight." },
    { id:'r7', a:'chen',   b:'poison',      label:'?',          status:'unknown', reason:"Unconfirmed — Chen had kitchen access near where the vial was stored." },
    { id:'r8', a:'violet', b:'poison',      label:'X',          status:'impossible', reason:"Violet is already confirmed with the Crystal Dagger — she can't have used two weapons." },
    { id:'r9', a:'chen',   b:'candlestick', label:'?',          status:'unknown', reason:"No clue yet connects Chen to the candlestick." },
  ];
  const initialStatuses = Object.fromEntries(relationships.map(r => [r.id, r.status]));

  const clues = [
    { id:1, status:'analyzed', text:"The Crystal Dagger was found near the garden fountain, still damp.", entities:['dagger','garden'] },
    { id:2, status:'analyzed', text:"Lady Violet was seen entering the mansion at 9:15 PM, wearing gloves.", entities:['violet'] },
    { id:3, status:'new',      text:"The butler confirms the garden was empty at 11:15 PM.", entities:['garden'] },
    { id:4, status:'new',      text:"Professor Grant has a documented fear of enclosed spaces — he avoids the conservatory.", entities:['grant','conservatory'] },
    { id:5, status:'used',     text:"A witness places Mr. Chen in the library until midnight.", entities:['chen','library'] },
    { id:6, status:'analyzed', text:"Lady Violet is right-handed, confirmed by her signature in the guestbook.", entities:['violet'] },
  ];

  let notes = [
    { id:'n1', x:340, y:60,  rot:-1.4, text:'Probably Violet…' },
    { id:'n2', x:820, y:820, rot: 1.1, text:'Check the garden clue again' },
  ];
  let noteSeq = 3;

  let selectedEntity = null;
  let currentView = 'board';

  /* ---------------------------------------------------------------
     Helpers
  ----------------------------------------------------------------*/
  function relsFor(id){ return relationships.filter(r => r.a===id || r.b===id); }
  function otherEnd(rel, id){ return rel.a===id ? rel.b : rel.a; }
  function statusIcon(status){
    if(status==='confirmed') return '✓';
    if(status==='impossible') return '✕';
    return '?';
  }
  function isMobile(){ return window.matchMedia('(max-width: 860px)').matches; }

  function showToast(a, b, explanation){
    const stack = document.getElementById('toastStack');
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `
      <div class="t-head">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        New deduction discovered
      </div>
      <div class="t-rel">${entities[a].name} → ${entities[b].name}</div>
      <div class="t-exp">${explanation}</div>`;
    stack.appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity .3s ease, transform .3s ease';
      el.style.opacity = '0';
      el.style.transform = 'translateY(-6px)';
      setTimeout(() => el.remove(), 320);
    }, 4800);
  }

  function updateProgress(){
    const n = relationships.filter(r => r.status==='confirmed').length;
    document.getElementById('confirmedCount').textContent = n;
  }

  /* ---------------------------------------------------------------
     Render: Clues
  ----------------------------------------------------------------*/
  function renderClues(){
    const list = document.getElementById('clueList');
    list.innerHTML = '';
    clues.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'clue-card';
      btn.dataset.id = c.id;
      btn.innerHTML = `
        <div class="clue-top">
          <span class="clue-num">CLUE #${String(c.id).padStart(2,'0')}</span>
          <span class="clue-status ${c.status}">${c.status[0].toUpperCase()+c.status.slice(1)}</span>
        </div>
        <div class="clue-text">${c.text}</div>`;
      btn.addEventListener('click', () => activateClue(c, btn));
      list.appendChild(btn);
    });
  }

  function activateClue(clue, btnEl){
    document.querySelectorAll('.clue-card').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');
    // clear selection styling, pulse related entities
    selectedEntity = null;
    renderBoardHighlight();
    clue.entities.forEach(id => {
      const card = document.querySelector(`.card[data-id="${id}"]`);
      if(card){
        card.classList.add('highlighted');
        card.classList.remove('pulse'); void card.offsetWidth; card.classList.add('pulse');
      }
    });
    if(isMobile()) closeCluesDrawer();
    const first = document.querySelector(`.card[data-id="${clue.entities[0]}"]`);
    if(first) first.scrollIntoView({behavior:'smooth', block:'center', inline:'center'});
  }

  /* ---------------------------------------------------------------
     Render: Board cards + notes
  ----------------------------------------------------------------*/
  function renderCards(){
    const layer = document.getElementById('cardLayer');
    layer.innerHTML = '';
    Object.values(entities).forEach(ent => {
      const el = document.createElement('div');
      el.className = 'card';
      el.dataset.id = ent.id;
      el.style.left = ent.x + 'px';
      el.style.top = ent.y + 'px';
      el.innerHTML = `
        <div class="card-top">
          <div class="card-icon">${ICONS[ent.type]}</div>
          <div class="card-label">${ent.type.toUpperCase()}</div>
        </div>
        <div class="card-name">${ent.name}</div>
        <div class="card-meta">${ent.meta}</div>`;
      el.addEventListener('click', (e) => { if(!el.dataset.dragged){ selectEntity(ent.id); } });
      makeDraggable(el, (x,y) => { ent.x = x; ent.y = y; drawConnections(); });
      layer.appendChild(el);
    });
  }

  function renderNotes(){
    const layer = document.getElementById('noteLayer');
    layer.innerHTML = '';
    notes.forEach(n => {
      const el = document.createElement('div');
      el.className = 'note';
      el.style.left = n.x + 'px';
      el.style.top = n.y + 'px';
      el.style.setProperty('--rot', n.rot + 'deg');
      el.innerHTML = `<div class="note-pin"></div><button class="note-del" title="Remove note">✕</button><div contenteditable="true" spellcheck="false">${n.text}</div>`;
      el.querySelector('.note-del').addEventListener('click', (e) => { e.stopPropagation(); notes = notes.filter(x => x.id!==n.id); renderNotes(); });
      el.querySelector('[contenteditable]').addEventListener('input', (e) => { n.text = e.target.innerHTML; });
      el.querySelector('[contenteditable]').addEventListener('pointerdown', (e) => e.stopPropagation());
      makeDraggable(el, (x,y) => { n.x = x; n.y = y; });
      layer.appendChild(el);
    });
  }

  function makeDraggable(el, onMove){
    let sx=0, sy=0, ox=0, oy=0, dragging=false;
    el.addEventListener('pointerdown', (e) => {
      if(e.target.closest('[contenteditable]') || e.target.closest('.note-del')) return;
      dragging = true; el.dataset.dragged = '';
      el.setPointerCapture(e.pointerId);
      sx = e.clientX; sy = e.clientY;
      ox = parseFloat(el.style.left)||0; oy = parseFloat(el.style.top)||0;
      el.style.zIndex = 30;
    });
    el.addEventListener('pointermove', (e) => {
      if(!dragging) return;
      const scale = 1;
      const dx = (e.clientX - sx)/scale, dy = (e.clientY - sy)/scale;
      if(Math.abs(dx) > 3 || Math.abs(dy) > 3) el.dataset.dragged = '1';
      const nx = Math.max(0, ox+dx), ny = Math.max(0, oy+dy);
      el.style.left = nx + 'px'; el.style.top = ny + 'px';
      onMove(nx, ny);
    });
    function end(e){
      if(!dragging) return;
      dragging = false; el.style.zIndex = '';
      setTimeout(() => { delete el.dataset.dragged; }, 0);
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }

  /* ---------------------------------------------------------------
     Render: connections
  ----------------------------------------------------------------*/
  function drawConnections(){
    const svg = document.getElementById('connSvg');
    const labelLayer = document.getElementById('connLabels');
    svg.innerHTML = '';
    labelLayer.innerHTML = '';
    const surface = document.getElementById('boardSurface');
    const sRect = surface.getBoundingClientRect();

    relationships.forEach(rel => {
      const elA = document.querySelector(`.card[data-id="${rel.a}"]`);
      const elB = document.querySelector(`.card[data-id="${rel.b}"]`);
      if(!elA || !elB) return;
      const ra = elA.getBoundingClientRect(), rb = elB.getBoundingClientRect();
      const ax = ra.left - sRect.left + ra.width/2, ay = ra.top - sRect.top + ra.height/2;
      const bx = rb.left - sRect.left + rb.width/2, by = rb.top - sRect.top + rb.height/2;

      const connected = selectedEntity && (rel.a===selectedEntity || rel.b===selectedEntity);
      const dim = selectedEntity && !connected;

      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      const mx = (ax+bx)/2, my = (ay+by)/2;
      const curveOffset = 0;
      path.setAttribute('d', `M ${ax} ${ay} Q ${mx} ${my} ${bx} ${by}`);
      path.setAttribute('class', `conn-line ${rel.status} ${dim?'dim':''} ${connected?'active':''}`);
      svg.appendChild(path);

      const label = document.createElement('div');
      label.className = `conn-label ${rel.status} ${dim?'dim':''}`;
      label.style.left = mx + 'px';
      label.style.top = my + 'px';
      label.textContent = rel.status==='unknown' ? '?' : (rel.status==='impossible' ? '✕ ' + rel.label : rel.label);
      labelLayer.appendChild(label);
    });
  }

  /* ---------------------------------------------------------------
     Selection + highlighting
  ----------------------------------------------------------------*/
  function selectEntity(id){
    selectedEntity = id;
    document.querySelectorAll('.clue-card').forEach(b => b.classList.remove('active'));
    renderBoardHighlight();
    renderInspector(id);
    if(isMobile()) openInspectorSheet();
  }

  function renderBoardHighlight(){
    const connectedIds = new Set();
    if(selectedEntity){
      connectedIds.add(selectedEntity);
      relsFor(selectedEntity).forEach(r => connectedIds.add(otherEnd(r, selectedEntity)));
    }
    document.querySelectorAll('.card').forEach(el => {
      const id = el.dataset.id;
      el.classList.remove('selected','highlighted','dimmed');
      if(!selectedEntity) return;
      if(id === selectedEntity) el.classList.add('selected');
      else if(connectedIds.has(id)) el.classList.add('highlighted');
      else el.classList.add('dimmed');
    });
    drawConnections();
  }

  /* ---------------------------------------------------------------
     Inspector
  ----------------------------------------------------------------*/
  function emptyInspector(){
    document.getElementById('inspectorBody').innerHTML = `
      <div class="empty-state">
        <div class="ic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><line x1="15.8" y1="15.8" x2="20.5" y2="20.5"/></svg>
        </div>
        <p>Select a suspect, weapon, or location to inspect it.</p>
      </div>`;
  }

  function renderInspector(id){
    const ent = entities[id];
    const body = document.getElementById('inspectorBody');
    const related = relsFor(id);
    const known = related.filter(r => r.status !== 'unknown');
    const possible = related.filter(r => r.status === 'unknown');
    const relatedClues = clues.filter(c => c.entities.includes(id));

    body.innerHTML = `
      <div class="insp-head">
        <div class="insp-icon">${ICONS[ent.type]}</div>
        <div>
          <div class="insp-name">${ent.name}</div>
          <div class="insp-type">${ent.type.toUpperCase()}</div>
        </div>
      </div>

      <div class="insp-section">
        <h3>Known facts</h3>
        ${ent.facts.map(f => `
          <div class="fact-row ${f.ok?'ok':'no'}">
            <span class="ic">${f.ok ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'}</span>
            <span>${f.text}</span>
          </div>`).join('')}
      </div>

      ${relatedClues.length ? `
      <div class="insp-section">
        <h3>Related clues</h3>
        ${relatedClues.map(c => `<div class="clue-chip"><b>#${String(c.id).padStart(2,'0')}</b><span>${c.text}</span></div>`).join('')}
      </div>` : ''}

      ${known.length ? `
      <div class="insp-section">
        <h3>Relationships</h3>
        ${known.map(r => renderRelRow(r, id, false)).join('')}
      </div>` : ''}

      ${possible.length ? `
      <div class="insp-section">
        <h3>Possible relationships</h3>
        ${possible.map(r => renderRelRow(r, id, true)).join('')}
      </div>` : ''}
    `;

    // wire up why-buttons
    body.querySelectorAll('.why-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const txt = btn.closest('.rel-row').querySelector('.why-text');
        txt.classList.toggle('open');
      });
    });
    // wire up confirm / impossible actions
    body.querySelectorAll('.rel-actions .confirm').forEach(btn => {
      btn.addEventListener('click', () => setRelationshipStatus(btn.dataset.rel, 'confirmed', id));
    });
    body.querySelectorAll('.rel-actions .impossible').forEach(btn => {
      btn.addEventListener('click', () => setRelationshipStatus(btn.dataset.rel, 'impossible', id));
    });
  }

  function renderRelRow(r, fromId, actionable){
    const target = entities[otherEnd(r, fromId)];
    return `
      <div class="rel-row">
        <div class="rel-top">
          <div class="rel-name"><span class="rel-mark ${r.status}">${statusIcon(r.status)}</span>${target.name}</div>
          <button class="why-btn">Why?</button>
        </div>
        <div class="why-text"><span class="q">WHY IS THIS ${r.status==='impossible'?'RULED OUT':'CONNECTED'}?</span>${r.reason}</div>
        ${actionable ? `
        <div class="rel-actions">
          <button class="confirm" data-rel="${r.id}">Confirm relationship</button>
          <button class="impossible" data-rel="${r.id}">Mark as impossible</button>
        </div>` : ''}
      </div>`;
  }

  function setRelationshipStatus(relId, status, fromId){
    const rel = relationships.find(r => r.id===relId);
    if(!rel) return;
    rel.status = status;
    updateProgress();
    drawConnections();
    renderGrid();
    if(selectedEntity) renderInspector(selectedEntity);
    if(status==='confirmed'){
      showToast(rel.a, rel.b, rel.reason);
    }
  }

  /* ---------------------------------------------------------------
     Grid view
  ----------------------------------------------------------------*/
  function renderGrid(){
    const gv = document.getElementById('gridView');
    const suspects = Object.values(entities).filter(e => e.type==='suspect');
    const weapons = Object.values(entities).filter(e => e.type==='weapon');
    const locations = Object.values(entities).filter(e => e.type==='location');

    function findRel(aId,bId){ return relationships.find(r => (r.a===aId&&r.b===bId)||(r.a===bId&&r.b===aId)); }
    function table(title, cols, rows){
      let head = `<th class="rowlabel"></th>` + cols.map(c=>`<th>${c.name}</th>`).join('');
      let body = rows.map(row => {
        let cells = cols.map(c => {
          const rel = findRel(row.id, c.id);
          if(!rel) return `<td></td>`;
          return `<td class="cell" data-rel="${rel.id}"><span class="gcell ${rel.status}">${statusIcon(rel.status)}</span></td>`;
        }).join('');
        return `<tr><td class="rowlabel">${row.name}</td>${cells}</tr>`;
      }).join('');
      return `<div class="grid-table-wrap"><div class="grid-title">${title}</div><table class="gt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
    }

    gv.innerHTML =
      table('Suspects × Weapons', weapons, suspects) +
      table('Suspects × Locations', locations, suspects);

    gv.querySelectorAll('.cell[data-rel]').forEach(td => {
      td.addEventListener('click', () => {
        const rel = relationships.find(r => r.id===td.dataset.rel);
        const order = ['unknown','confirmed','impossible'];
        const next = order[(order.indexOf(rel.status)+1) % order.length];
        rel.status = next;
        updateProgress();
        renderGrid();
        drawConnections();
        if(next==='confirmed') showToast(rel.a, rel.b, rel.reason);
      });
    });
  }

  /* ---------------------------------------------------------------
     Toolbar: view switch, add note, reset
  ----------------------------------------------------------------*/
  document.getElementById('viewSeg').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-view]');
    if(!btn) return;
    currentView = btn.dataset.view;
    document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('active', b===btn));
    document.getElementById('boardScroll').classList.toggle('hidden', currentView!=='board');
    document.getElementById('gridView').classList.toggle('active', currentView==='grid');
    if(currentView==='grid') renderGrid();
  });

  document.getElementById('addNoteBtn').addEventListener('click', () => {
    const scroll = document.getElementById('boardScroll');
    const n = {
      id: 'n'+(noteSeq++),
      x: 420 + (noteSeq*26)%260,
      y: 260 + (noteSeq*37)%220,
      rot: (Math.random()*4-2),
      text: 'New note'
    };
    notes.push(n);
    renderNotes();
    scroll.scrollTo({left: Math.max(0,n.x-300), top: Math.max(0,n.y-200), behavior:'smooth'});
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    relationships.forEach(r => { r.status = initialStatuses[r.id]; });
    notes = [
      { id:'n1', x:340, y:60,  rot:-1.4, text:'Probably Violet…' },
      { id:'n2', x:820, y:820, rot: 1.1, text:'Check the garden clue again' },
    ];
    noteSeq = 3;
    selectedEntity = null;
    document.querySelectorAll('.clue-card').forEach(b => b.classList.remove('active'));
    renderNotes();
    renderBoardHighlight();
    emptyInspector();
    updateProgress();
    renderGrid();
    closeInspectorSheet();
  });

  /* ---------------------------------------------------------------
     Mobile: bottom nav, drawers, sheets
  ----------------------------------------------------------------*/
  const cluesPanel = document.getElementById('cluesPanel');
  const inspectorPanel = document.getElementById('inspectorPanel');
  const backdrop = document.getElementById('backdrop');

  function openCluesDrawer(){ cluesPanel.classList.add('open'); backdrop.classList.add('show'); }
  function closeCluesDrawer(){ cluesPanel.classList.remove('open'); backdrop.classList.remove('show'); }
  function openInspectorSheet(){ inspectorPanel.classList.add('open'); }
  function closeInspectorSheet(){ inspectorPanel.classList.remove('open'); }

  document.getElementById('sheetClose').addEventListener('click', closeInspectorSheet);
  backdrop.addEventListener('click', () => { closeCluesDrawer(); });

  document.getElementById('bottomNav').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-tab]');
    if(!btn) return;
    document.querySelectorAll('#bottomNav button').forEach(b => b.classList.toggle('active', b===btn));
    const tab = btn.dataset.tab;
    closeCluesDrawer();
    if(tab==='clues'){ openCluesDrawer(); }
    else if(tab==='board'){
      currentView='board';
      document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('active', b.dataset.view==='board'));
      document.getElementById('boardScroll').classList.remove('hidden');
      document.getElementById('gridView').classList.remove('active');
    }
    else if(tab==='suspects' || tab==='evidence'){
      currentView='board';
      document.getElementById('boardScroll').classList.remove('hidden');
      document.getElementById('gridView').classList.remove('active');
      const type = tab==='suspects' ? 'suspect' : 'weapon';
      const first = Object.values(entities).find(en => en.type===type);
      const el = document.querySelector(`.card[data-id="${first.id}"]`);
      if(el) setTimeout(()=> el.scrollIntoView({behavior:'smooth', block:'center', inline:'center'}), 60);
    }
    else if(tab==='accuse'){ openAccuseModal(); }
  });

  function openAccuseModal(){
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(30,27,20,0.4);';
    const suspects = Object.values(entities).filter(e=>e.type==='suspect');
    wrap.innerHTML = `
      <div style="background:var(--card);width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-lg);font-family:'Inter',sans-serif;">
        <div style="font-family:'Outfit',sans-serif;font-weight:600;font-size:16px;margin-bottom:4px;">Make your accusation</div>
        <div style="font-size:12.5px;color:var(--text-soft);margin-bottom:14px;">Choose who you believe committed the crime.</div>
        ${suspects.map(s => `
          <label style="display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--card-border);font-size:13.5px;cursor:pointer;">
            <input type="radio" name="accuse" value="${s.id}" style="accent-color:var(--gold);width:16px;height:16px;">
            ${s.name}
          </label>`).join('')}
        <div style="display:flex;gap:8px;margin-top:16px;">
          <button id="accuseCancel" class="btn ghost" style="flex:1;justify-content:center;">Cancel</button>
          <button id="accuseSubmit" class="btn" style="flex:1;justify-content:center;background:var(--gold);border-color:var(--gold);color:#fff;">Submit accusation</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    wrap.querySelector('#accuseCancel').addEventListener('click', () => wrap.remove());
    wrap.addEventListener('click', (e) => { if(e.target===wrap) wrap.remove(); });
    wrap.querySelector('#accuseSubmit').addEventListener('click', () => {
      const picked = wrap.querySelector('input[name="accuse"]:checked');
      wrap.remove();
      if(picked){
        showToast('violet','garden', `You'll need stronger evidence before that will stick — keep building your case.`);
      }
    });
  }

  window.addEventListener('resize', drawConnections);
  document.getElementById('boardScroll').addEventListener('scroll', drawConnections);

  /* ---------------------------------------------------------------
     Init
  ----------------------------------------------------------------*/
  renderClues();
  renderCards();
  renderNotes();
  emptyInspector();
  updateProgress();
  requestAnimationFrame(drawConnections);
  renderGrid();

})();
</script>
</body>
</html>
